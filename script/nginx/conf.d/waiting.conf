# ============================================================
# 等待状态配置 —— 服务升级期间临时使用
# ============================================================
# 效果：使所有路由请求显示 /upSysing 加载页（由前端 SPA 渲染）
# 原理：作为 default_server 监听 80 端口，拦截所有未匹配的请求，
#       通过 302 重定向到 /upSysing，由 Vue Router 渲染加载页组件
# 依赖：需要 frontend 软链存在（由 SetNginxWaiting 保留），
#       以提供 index.html 与 /assets/ 静态资源
# 激活方式：由 qf_scmc reset_nginx -wait 指令安装到 conf.d/scm_waiting.conf
# 退出方式：qf_scmc reset_nginx -now 恢复正常配置
# ============================================================

server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    # ===== 前端静态资源（JS/CSS/字体等），保持原样直出 =====
    # 加载页依赖 index.html 引用的 /assets/*.js 与 /assets/*.css
    location /assets/ {
        root /etc/nginx/conf.d/frontend;
        try_files $uri =404;
    }

    # ===== favicon 等根目录静态文件 =====
    location ~ ^/(favicon\.ico|robots\.txt)$ {
        root /etc/nginx/conf.d/frontend;
        try_files $uri =404;
    }

    # ===== /upSysing 返回 index.html，由 SPA 命中加载页路由 =====
    location = /upSysing {
        root /etc/nginx/conf.d/frontend;
        try_files /index.html =404;
    }

    # ===== 所有其他请求 302 重定向到 /upSysing =====
    # 等待状态下不暴露任何业务路由，统一引导至加载页
    location / {
        return 302 /upSysing;
    }
}