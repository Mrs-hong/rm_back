# ============================================================
# HTTP API 代理配置 —— qifeng_ca (drogon C++ 框架)
# ============================================================
# 后端服务监听 127.0.0.1:8080，由本文件统一代理 /web/、/sys/、/uploaded_files/
# 参考路由定义: .run/test_nginx/qifeng_ca/route.conf
# 参考服务配置: .run/test_nginx/qifeng_ca/config/http_config.json
# ============================================================

# ===== /web/* 用户业务接口 =====
# route.conf 对应路由:
#   /web/user/*, /web/meeting/*, /web/hotword/*, /web/voiceprint/*,
#   /web/note/*, /web/audit/*, /web/config/*
# 认证要求: 需要 JWT + RBAC 登录认证
location /web/ {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # WebSocket 支持（drogon 可能用到）
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    # CORS 预检支持
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Max-Age'       '86400' always;
        return 204;
    }
}


location /data/ {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # 转发 Range 请求头（浏览器拖动音频进度条必需）
    proxy_set_header   Range             $http_range;
    proxy_set_header   If-Range          $http_if_range;

    # 必须设置为空，保持标准 HTTP keep-alive（不能用 "upgrade"，那是 WebSocket 专用）
    proxy_set_header   Connection        "";

    # 不缓冲，让 drogon 的 206 Partial Content 直接透传
    proxy_buffering    off;

    # 禁止压缩，避免音频数据损坏
    gzip               off;

    # 告知浏览器支持分段请求
    add_header         Accept-Ranges     bytes;

    # 跨域支持
    add_header         Access-Control-Allow-Origin  *;
    add_header         Access-Control-Allow-Methods 'GET, OPTIONS';
    add_header         Access-Control-Allow-Headers 'Range';
    add_header         Access-Control-Expose-Headers 'Accept-Ranges, Content-Range, Content-Length, Content-Type';

    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Content-Range, Accept-Ranges' always;
        add_header 'Access-Control-Max-Age'       '86400' always;
        add_header 'Accept-Ranges' 'bytes' always;
        return 204;
    }
}

# ===== /sys/* 系统管理接口 =====
# route.conf 对应路由:
#   /sys/device/*, /sys/network/*, /sys/user/*, /sys/config/*
# 认证要求: 设备/网络接口免认证，其他视具体接口而定
location /sys/ {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Max-Age'       '86400' always;
        return 204;
    }
}

# ===== /ws/subscribe 系统消息 WebSocket 订阅 =====
# 长连接推送通道，需保持连接不断开
location /ws/subscribeSysMsg {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;

    # WebSocket 协议升级
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # WebSocket 长连接超时（默认 60s 会断开，设为 1 小时）
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
}

# ===== /ws/subscribe 通用 WebSocket 订阅 =====
location /ws/subscribe {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;

    # WebSocket 协议升级
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # WebSocket 长连接超时
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
}

# ===== /uploaded_files/* 文件上传/下载 =====
# drogon http_config.json 中 locations 定义:
#   path: "/uploaded_files", alias: "uploaded_files", allow_all: true
location /uploaded_files/ {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # 上传大文件时不缓冲
    proxy_request_buffering off;
}
