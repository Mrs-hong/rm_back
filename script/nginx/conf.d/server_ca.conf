server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    # 允许上传大文件
    client_max_body_size 10G;
    client_body_buffer_size 64k;

    # 避免中途超时
    client_body_timeout 3600s;
    client_header_timeout 3600s;
    send_timeout 3600s;

    # 防止 502/504
    proxy_connect_timeout 300s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # 禁用缓存（流式上传）
    proxy_request_buffering off;
    proxy_buffering off;

    # 禁止将 proxy 的文件写入磁盘
    proxy_max_temp_file_size 0;

    # 关闭 gzip 避免 CPU 压力
    gzip off;

    # ===== Windows 网络连接测试 =====
    location = /connecttest.txt {
        default_type text/plain;
        return 200 "Microsoft Connect Test";
    }

    location = /ncsi.txt {
        default_type text/plain;
        return 200 "Microsoft NCSI";
    }

    # ===== 麒麟 / UOS / Android 网络认证 =====
    location = /generate_204 {
        return 204;
    }

    # 兼容部分旧系统
    location = /gen_204 {
        return 204;
    }

    # ===== 前端静态页面 =====
    # 使用绝对路径指向 init_nginx 创建的软链 /etc/nginx/conf.d/frontend
    # （相对路径 ./frontend 会基于 nginx --prefix 解析为 /usr/share/nginx/frontend，导致文件找不到）
    location / {
        root   /etc/nginx/conf.d/frontend;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # SPA 刷新支持
    }

    # ===== 后端 API 代理配置（独立文件，便于维护）=====
    # 使用 snippets 目录避免被 conf.d/*.conf 自动加载到 http 块
    include /etc/nginx/snippets/snippet_http_ca.conf;

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /etc/nginx/conf.d/frontend;
    }

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
