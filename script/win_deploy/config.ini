; ==========================================================================
; win_deploy 配置文件 — IT 预置一次，产线工人不修改
;
; 调用：run.bat 启动时通过 lib\ini.bat 解析本文件
; 修改后无需重启，下次运行 run.bat 自动生效
; ==========================================================================

[device]
; 设备 IP（产线设备默认固定 IP）
ip=192.168.112.223
; SSH 登录用户名
ssh_user=linaro
; SSH 登录密码（接受明文，产线场景由 IT 预置）
ssh_password=linaro
; root 密码（用于远程 sudo -S，绝不落盘）
root_password=linaro
; SSH 端口
ssh_port=22
; 设备厂商（决定 scripts/<vendor>/ 下的硬件检测脚本集）
vendor=huayu

[paths]
; 远程测试根目录（设备端，run.bat 上传至此）
remote_testcheck_dir=/data/testcheck
; 远程日志路径（pcba_check.sh 输出落盘，bat 下载用）
remote_log=/tmp/pcba_check_output.log
; 本地 deb 包目录（相对 win_deploy 根）
local_deb_dir=deb
; 本地结果归档目录（相对 win_deploy 根，自动创建）
local_results_dir=results

[timing]
; 远程 pcba_check.sh 整体执行超时（秒）— 全局兜底，超时即 kill plink
exec_timeout_sec=600
; 设备端单脚本超时（秒）— 由 pcba_check.sh 包装每个子脚本
single_script_timeout_sec=120
; SSH 命令重试次数（短命令如 mkdir/chmod）
ssh_retry=3
; 单次上传重试次数
scp_retry=3
; 重试退避基数（秒）：2, 4, 8 ...
retry_backoff_base=2

[production]
; 完成一台后是否自动进入下一台循环
auto_next=true
; 自动进入下一台的倒计时（秒）
auto_next_delay_sec=5
; 完成时是否蜂鸣
beep_on_finish=true
; 单次结果文件保留份数（0=不限，>0=旧文件滚动清理）
result_keep_count=0
